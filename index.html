<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071426">
  <title>World Explorer | Discover the world</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] }, colors: { midnight: '#071426', ocean: '#0ea5e9' } } }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">
  <header
    class="sticky top-0 z-40 border-b border-white/10 bg-slate-950/95 text-white shadow-lg shadow-slate-950/10 backdrop-blur-xl">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-5 px-5 py-4 lg:px-8">
      <a href="#home" class="flex items-center gap-3 no-underline">
        <span class="grid h-10 w-10 place-items-center rounded-2xl bg-gradient-to-br from-cyan-400 to-blue-600 text-xl shadow-lg shadow-cyan-500/20">🌍</span>
        <span class="font-extrabold tracking-tight text-cyan-400 text-xl">World Explorer</span>
      </a>
      <nav class="flex items-center gap-2 text-sm font-semibold text-slate-300 sm:gap-7">
        <a class="rounded-full px-3 py-2 transition hover:bg-white/10 hover:text-white" href="#home">Home</a>
        <a class="rounded-full px-3 py-2 transition hover:bg-white/10 hover:text-white" href="#explore">Explore</a>
        <a class="rounded-full px-3 py-2 transition hover:bg-white/10 hover:text-white"
          href="#countryContainer">Countries</a>
      </nav>
    </div>
  </header>

  <main id="home">
  </main>
</body>

</html>
