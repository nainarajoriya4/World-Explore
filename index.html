<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071426">
  <title>World Explorer | Discover the world</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] }, colors: { midnight: '#071426', ocean: '#0ea5e9' } } }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">
  <header
    class="sticky top-0 z-40 border-b border-white/10 bg-slate-950/95 text-white shadow-lg shadow-slate-950/10 backdrop-blur-xl">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-5 px-5 py-4 lg:px-8">
      <a href="#home" class="flex items-center gap-3 no-underline">
        <span class="grid h-10 w-10 place-items-center rounded-2xl bg-gradient-to-br from-cyan-400 to-blue-600 text-xl shadow-lg shadow-cyan-500/20">🌍</span>
        <span class="font-extrabold tracking-tight text-cyan-400 text-xl">World Explorer</span>
      </a>
      <nav class="flex items-center gap-2 text-sm font-semibold text-slate-300 sm:gap-7">
        <a class="rounded-full px-3 py-2 transition hover:bg-white/10 hover:text-white" href="#home">Home</a>
        <a class="rounded-full px-3 py-2 transition hover:bg-white/10 hover:text-white" href="#explore">Explore</a>
        <a class="rounded-full px-3 py-2 transition hover:bg-white/10 hover:text-white"
          href="#countryContainer">Countries</a>
      </nav>
    </div>
  </header>

  <main id="home">
    <section id="explore" class="relative isolate overflow-hidden bg-slate-950 text-white">
      <div
        class="absolute inset-0 -z-10 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-700/40 via-slate-950 to-slate-950">
      </div>
      <div class="absolute -right-20 top-10 -z-10 h-72 w-72 rounded-full bg-cyan-400/10 blur-3xl"></div>
      <div class="mx-auto max-w-7xl px-5 pb-16 pt-16 text-center sm:pb-20 sm:pt-24 lg:px-8">
        <span
          class="mb-6 inline-flex items-center gap-2 rounded-full border border-cyan-300/20 bg-cyan-300/10 px-4 py-2 text-xs font-bold uppercase tracking-[.2em] text-cyan-200">Your
          journey starts here</span>
        <h1 class="mx-auto max-w-4xl font-extrabold leading-tight tracking-tight text-4xl sm:text-6xl lg:text-7xl"
          style="font-family:Manrope,sans-serif">The world is yours<br><span
            class="bg-gradient-to-r from-cyan-300 to-blue-400 bg-clip-text text-transparent">to discover.</span></h1>
        <p class="mx-auto mt-5 max-w-2xl text-base leading-7 text-slate-300 sm:text-lg">Explore countries, discover
          cultures, and uncover fascinating places across our beautiful planet.</p>
        <div
          class="mx-auto mt-10 max-w-3xl rounded-2xl border border-white/10 bg-white/10 p-3 shadow-2xl shadow-black/20 backdrop-blur-md">
          <div class="flex flex-col gap-3 sm:flex-row">
            <div class="relative flex-1">
              <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">⌕</span>
              <input type="text" id="searchInput" placeholder="Search by country or capital..."
                class="w-full rounded-xl border border-white/10 bg-slate-950/70 py-4 pl-11 pr-4 text-sm text-white outline-none transition placeholder:text-slate-400 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20">
            </div>
            <button id="searchBtn" type="button"
              class="rounded-xl bg-cyan-400 px-8 py-4 text-sm font-extrabold text-slate-950 shadow-lg shadow-cyan-500/20 transition hover:-translate-y-0.5 hover:bg-cyan-300">Search
              countries <span aria-hidden="true">→</span></button>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
